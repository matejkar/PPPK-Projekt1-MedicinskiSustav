services:
  postgres:
    image: postgres:16-alpine
    container_name: pppk-medic-postgres
    environment:
      POSTGRES_USER: medic
      POSTGRES_PASSWORD: medic
      POSTGRES_DB: medical_db
    ports:
      - "5433:5432"
    volumes:
      - medic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medic -d medical_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medic_pgdata:
